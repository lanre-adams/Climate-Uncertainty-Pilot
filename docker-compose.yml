services:
  pilot:
    build: .
    image: climate-llm-pilot:0.2.0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama on your machine

  web:
    build: .
    image: climate-llm-pilot:0.2.0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["web", "--host", "0.0.0.0", "--port", "8000"]

  tests:
    build: .
    image: climate-llm-pilot:0.2.0
    entrypoint: ["python", "-m", "pytest", "-q", "tests"]
